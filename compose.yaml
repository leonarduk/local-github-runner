# Keeps N ephemeral runners available for this repo.
#
#   cd runner
#   printf '%s' 'ghp_your_pat_here' > pat.secret   # gitignored
#   docker compose up -d --build
#   docker compose logs -f
#
# Each container serves one job and exits; `restart: always` brings a fresh
# one straight back, so the pool stays warm without any job ever inheriting
# another job's leftovers. The pool size is declared below; override it for a
# one-off with `docker compose up -d --scale runner=3` -- `container_name` is
# deliberately unset so that works.

# A fixed project name. Compose otherwise derives it from the directory it
# is run from, so a Jenkins job -- whose workspace path varies by job name,
# and which may be wiped between builds -- would lose track of the running
# pool and silently start a second one alongside it.
name: gh-runner

services:
  runner:
    build:
      context: .
      # Uncomment to track a newer runner release without editing the
      # Dockerfile. The checksums are per-version, so bump those too.
      # args:
      #   RUNNER_VERSION: 2.337.0
    image: spring-practice-tests-runner:local
    restart: always
    # The pool size, declared so that a bare `docker compose up -d` converges
    # to it. Compose honours this outside swarm, and an explicit
    # `--scale runner=N` still wins -- which is what runner/Jenkinsfile passes
    # from RUNNER_COUNT. Without a default here, a plain `up -d` silently
    # stops every container past the first, and the jobs they were serving
    # start queueing behind each other for no visible reason.
    #
    # Two, because ci.yml has two jobs and neither should wait for the other.
    deploy:
      replicas: 2
    # Compose's default 10s is too short for entrypoint.sh's deregistration,
    # which starts only once run.sh has wound down and then costs two GitHub
    # round-trips (mint a removal token, then `config.sh remove`).
    #
    # Necessary but NOT sufficient on its own: SIGTERM currently reaches
    # run.sh and never the Runner.Listener process that
    # RUNNER_MANUALLY_TRAP_SIG=1 arms, so the runner never exits and the
    # container is SIGKILLed whatever this is set to -- measured at a full 60s
    # on 2026-09-05. See "Shutdown does not deregister" in README.md. This
    # only starts paying off once that signalling is fixed.
    stop_grace_period: 60s
    environment:
      # Overridable from a .env file beside this one, so the same compose
      # file works unchanged on every runner host. See .env.example.
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-leonarduk/spring-professional-udemy-practice-tests}
      RUNNER_TOKEN_FILE: /run/secrets/github_pat
      # RUNNER_HOST_LABEL names the machine, so a workflow can target one
      # host and `gh api .../actions/runners` says which box a runner is on.
      # Container hostnames are random hex, which is useless for telling two
      # machines apart once there is more than one.
      RUNNER_LABELS: self-hosted,linux,x64,docker,${RUNNER_HOST_LABEL:-unlabelled-host}
      # Deliberately not setting RUNNER_NAME: it must be unique per
      # container or `--scale` fails, since GitHub rejects a duplicate
      # runner name. entrypoint.sh builds one from this label plus the
      # container's own hostname and pid.
      RUNNER_HOST_LABEL: ${RUNNER_HOST_LABEL:-}
    secrets:
      - github_pat
    # No volume for /home/runner/_work on purpose. The container is thrown
    # away after one job, so its own writable layer already gives each job a
    # clean checkout -- and a named volume would quietly reintroduce the
    # cross-job state that --ephemeral exists to prevent. A tmpfs is not the
    # answer either: Docker mounts those noexec and 64 MB by default, which
    # breaks anything a build tries to execute out of the workspace.
    #
    # Note there is deliberately no `no-new-privileges` here. The repo's own
    # ci.yml installs actionlint with `sudo mv`, matching what a
    # GitHub-hosted runner allows, and that flag blocks setuid and so breaks
    # sudo. Isolation comes from the container being ephemeral, not from
    # restricting the job's rights inside it.
    #
    # A job gets no more of the host than it needs. Raise these if a build
    # starts being OOM-killed, rather than removing them outright.
    mem_limit: 2g
    pids_limit: 512

secrets:
  github_pat:
    # Compose bind-mounts this file into the container, and re-reads it on
    # every restart -- and these containers restart constantly by design,
    # one per job. So the file has to outlive whatever created it.
    #
    # That matters for the Jenkins job (runner/Jenkinsfile): a Jenkins
    # workspace is not a durable location, so the job writes the PAT to a
    # persistent path and points RUNNER_PAT_FILE at it. Deleting the file
    # after `compose up` would leave the pool working right up until the
    # next container restart, then fail in a way that looks unrelated.
    file: ${RUNNER_PAT_FILE:-./pat.secret}
